<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5">
<meta name="theme-color" content="#0f1218">
<meta name="description" content="Riftbound practice — learn the rules and keywords by tapping, not reading.">
<meta property="og:title" content="Riftbound Coach">
<meta property="og:description" content="Practice the rules and keywords by tapping, not reading.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://tcgplayer-cdn.tcgplayer.com/product/653009_in_400x400.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="apple-touch-icon" href="https://tcgplayer-cdn.tcgplayer.com/product/653009_in_400x400.jpg">
<title>Riftbound Coach</title>
<style>
:root{
  --ink:#0f1218; --panel:#181c27; --line:#232a3d; --dim:#8b93a6; --fg:#e8e6e0;
  --good:#1e8449; --bad:#c0392b; --warn:#ca6f1e; --info:#2471a3;
  --fs:19px; --nav:78px;
}
html.big{ --fs:23px; }
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--ink); color:var(--fg); font-size:var(--fs);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  line-height:1.45; letter-spacing:.01em;
  padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom));
  overflow-x:hidden;
}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.01em}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

/* ---- top bar ---- */
header{
  position:sticky;top:0;z-index:40;background:rgba(15,18,24,.96);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;padding:10px 14px;
  padding-top:calc(10px + env(safe-area-inset-top));
}
header .ttl{font-size:.86em;font-weight:800;letter-spacing:.06em;color:var(--dim);flex:1}
header .tool{
  min-width:46px;min-height:46px;border-radius:12px;border:1px solid var(--line);
  background:#151924;display:grid;place-items:center;font-size:.8em;font-weight:700;color:var(--dim)
}
header .tool.on{background:var(--info);border-color:var(--info);color:#fff}

/* ---- layout ---- */
main{padding:16px 14px 30px;max-width:640px;margin:0 auto}
.view{display:none} .view.on{display:block}
.lede{color:var(--dim);font-size:.82em;margin:0 0 16px;line-height:1.5}

/* ---- big tappable rows ---- */
.row{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  background:var(--panel);border:1px solid var(--line);border-radius:16px;
  padding:14px;margin-bottom:10px;min-height:74px;
}
.row:active{transform:scale(.99)}
.row .ic{flex:none;width:52px;height:52px;border-radius:13px;display:grid;place-items:center;
  background:#11141c;border:1px solid var(--line);font-size:1.35em}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-size:1em;line-height:1.25}
.row .tx small{display:block;color:var(--dim);font-size:.76em;margin-top:3px;line-height:1.4}
.row .go{flex:none;color:var(--dim);font-size:1.1em}

/* ---- cards ---- */
.cardimg{display:block;width:100%;border-radius:12px;background:#0b0d12;
  aspect-ratio:5/7;object-fit:cover}
.cardwrap{position:relative;display:block;margin:0 auto;max-width:300px;padding:0;
  background:none;border:none}
.cardwrap.md{max-width:186px}
.cardwrap.sm{max-width:100%}
.cardwrap .mag{position:absolute;right:5px;bottom:5px;width:26px;height:26px;border-radius:50%;
  background:rgba(8,10,14,.78);display:grid;place-items:center;font-size:12px;
  border:1px solid rgba(255,255,255,.22)}
.minigrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pickcard{padding:0;background:none;border:2px solid transparent;border-radius:14px}
.pickcard .pn{display:block;margin-top:5px;font-size:.6em;color:var(--dim);line-height:1.25}
.pickcard:active{border-color:var(--info)}
/* full-size card on demand */
.lb{position:fixed;inset:0;z-index:99;background:rgba(6,8,12,.94);display:grid;place-items:center;padding:18px}
.lb img{max-width:100%;max-height:100%;border-radius:14px}

/* ---- the play row: card + its timing badge, side by side ---- */
.playrow{display:flex;align-items:center;gap:14px;justify-content:center;margin:4px 0 2px}
.tbadge{font-size:.66em;font-weight:800;letter-spacing:.06em;color:#fff;background:var(--c,#2471a3);
  border-radius:10px;padding:9px 12px;max-width:112px;line-height:1.25;text-align:center}
.ask{margin-top:12px;font-size:1.12em;font-weight:800}

/* ---- answer buttons: the main interaction ---- */
.ans{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.ans button{
  min-height:86px;border-radius:18px;border:2px solid var(--line);background:var(--panel);
  font-size:1.5em;font-weight:800;display:grid;place-items:center;gap:2px;line-height:1.1
}
.ans button small{font-size:.44em;font-weight:700;letter-spacing:.08em;color:var(--dim)}
.ans button.yes{border-color:#245c3a} .ans button.yes:active{background:#12281c}
.ans button.no{border-color:#5c2424}  .ans button.no:active{background:#28120f}
.ans.wide{grid-template-columns:1fr}

/* ---- verdict banner ---- */
.verd{margin-top:16px;border-radius:16px;padding:15px;border:2px solid;display:none}
.verd.on{display:block;animation:pop .18s ease-out}
.verd.ok{border-color:var(--good);background:#0f2318}
.verd.no{border-color:var(--bad);background:#2a1412}
.verd .vh{display:flex;align-items:center;gap:10px;font-size:1.15em;font-weight:800}
.verd .vb{margin-top:8px;font-size:.82em;color:#cfd5e0;line-height:1.5}
.verd .rule{margin-top:8px;font-size:.62em;letter-spacing:.05em;color:var(--dim)}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---- state banner (WHEN) ---- */
.state{border-radius:16px;padding:13px 15px;border:2px solid;margin-bottom:10px}
.state.row2{display:flex;align-items:center;gap:13px;text-align:left}
.state .sic{font-size:1.9em;line-height:1;flex:none}
.state .sl{font-size:1.1em;font-weight:800;letter-spacing:.02em}
.state .ss{font-size:.72em;color:#cfd5e0;opacity:.9}

/* ---- the 2x2 grid of turn states ---- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:14px 0}
.grid2 .g{border:1px solid var(--line);border-radius:14px;padding:12px 10px;background:var(--panel);
  min-height:112px;display:flex;flex-direction:column;gap:5px}
.grid2 .g b{font-size:.84em} .grid2 .g small{font-size:.66em;color:var(--dim);line-height:1.35}
.grid2 .g .slots{margin-top:auto;display:flex;gap:5px}
.tk{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;border-radius:8px;
  padding:5px 2px;font-style:normal;font-size:.72em;border:1px solid}
.tk b{font-size:.86em;opacity:.85}
.tk.y{background:#12281c;border-color:#245c3a;color:#5fd08a}
.tk.n{background:#241413;border-color:#5c2424;color:#e0736a}
.key{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;font-size:.62em;color:var(--dim);margin-top:2px}
.key b{color:var(--fg)}

/* ---- chips: one swipeable row, so they never eat the phone screen ---- */
.chips{display:flex;gap:8px;margin:10px -14px 12px;padding:2px 14px 6px;
  overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;white-space:nowrap;border:1px solid var(--line);background:#151924;border-radius:999px;
  padding:9px 15px;font-size:.72em;font-weight:700;color:var(--dim);min-height:44px;
  display:inline-flex;align-items:center;gap:7px}
.chip.on{background:var(--c,#2471a3);border-color:var(--c,#2471a3);color:#fff}

/* ---- keyword flashcard ---- */
.kwhead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.kwhead .kb{font-size:.62em;font-weight:800;letter-spacing:.09em;padding:5px 11px;
  border-radius:999px;background:#151924;border:1px solid var(--line);color:var(--dim)}
.kwname{font-size:1.7em;font-weight:800;letter-spacing:-.02em}
.kwhead2{font-size:1.15em;font-weight:700;color:#fff;margin:2px 0 10px;line-height:1.3}
.official{background:#11141c;border:1px solid var(--line);border-left:3px solid var(--info);
  border-radius:10px;padding:12px 13px;font-size:.8em;color:#cfd5e0;line-height:1.5}
.official .src{display:block;margin-top:7px;font-size:.72em;color:var(--dim)}
.reveal{margin-top:14px}
.hidden{display:none}

/* ---- progress ---- */
.bar{height:8px;border-radius:99px;background:#1b1f2b;overflow:hidden;margin:14px 0 4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#1e8449,#3fa7d6);width:0%}
.pstat{font-size:.7em;color:var(--dim);text-align:center;margin-bottom:8px}

/* ---- score track (WIN) ---- */
.track{display:flex;gap:5px;justify-content:center;margin:16px 0}
.track i{width:26px;height:34px;border-radius:6px;border:2px solid var(--line);background:#11141c;
  display:grid;place-items:center;font-size:.6em;color:var(--dim);font-style:normal;font-weight:800}
.track i.on{background:var(--good);border-color:var(--good);color:#fff}
.track i.last{border-color:var(--warn)}

/* ---- glyphs inside card text ---- */
.pip{display:inline-block;width:.82em;height:.82em;border-radius:50%;background:var(--p,#888);
  vertical-align:-.06em;margin:0 1px;border:1px solid rgba(255,255,255,.25)}
.pip.rainbow{background:conic-gradient(#c0392b,#b7950b,#1e8449,#2471a3,#7d3c98,#c0392b)}
.en{display:inline-grid;place-items:center;min-width:1.15em;height:1.15em;border-radius:50%;
  background:#333a4a;color:#fff;font-size:.72em;font-style:normal;font-weight:800;
  vertical-align:-.12em;margin:0 1px;padding:0 .2em}
.mt{display:inline-block;width:.8em;height:.8em;background:#d9a441;vertical-align:-.05em;
  margin:0 1px;clip-path:polygon(50% 0,100% 38%,82% 100%,18% 100%,0 38%)}
.ex{display:inline-block;width:.8em;height:.8em;border:2px solid var(--dim);border-radius:50%;
  border-top-color:transparent;vertical-align:-.1em;margin:0 2px}
.ctext{font-size:.78em;color:#c3cad6;line-height:1.7;margin-top:10px}
.kwtag{display:inline-block;background:#2b3550;color:#cfe0ff;border-radius:5px;
  padding:1px 7px;font-size:.86em;font-weight:800;letter-spacing:.02em;margin:0 1px;
  border:1px solid #3c4a6e}
.trig{display:inline-block;color:#8fa4c8;font-style:normal;font-size:.7em;margin:0 3px}

/* ---- bottom nav ---- */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:50;display:grid;grid-template-columns:repeat(5,1fr);
  background:rgba(15,18,24,.98);backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
nav button{padding:9px 2px 10px;display:grid;place-items:center;gap:3px;color:var(--dim);min-height:var(--nav)}
nav button .ni{font-size:1.45em;line-height:1}
nav button .nl{font-size:.56em;font-weight:800;letter-spacing:.08em}
nav button.on{color:#fff}
nav button.on .ni{transform:translateY(-1px)}
nav button.on .nl{color:#3fa7d6}

.centre{text-align:center}
.muted{color:var(--dim);font-size:.75em}
.sect{font-size:.66em;font-weight:800;letter-spacing:.11em;color:var(--dim);margin:22px 0 10px}
.big-btn{width:100%;min-height:64px;border-radius:16px;background:var(--info);color:#fff;
  font-weight:800;font-size:1.02em;margin-top:14px;border:none}
.big-btn.ghost{background:#151924;border:1px solid var(--line);color:var(--fg)}
</style>
</head>
<body>

  <div class="ttl">RIFTBOUND COACH</div>
  <button class="tool" id="bigBtn" aria-label="Bigger text">A+</button>
</header>

<main>

  <section class="view" id="v-when"></section>
  <section class="view" id="v-words"></section>

<nav>

  <button data-v="words"><span class="ni">&#127183;</span><span class="nl">WORDS</span></button>
  <button data-v="fight"><span class="ni">&#9876;</span><span class="nl">FIGHT</span></button>
  <button data-v="win"><span class="ni">&#127942;</span><span class="nl">WIN</span></button>
</nav>

mt\" aria-label=\"might\"></i> while I&#x27;m an attacker.", "x": "<b class=\"kwtag\">Assault</b> (+1 <i class=\"mt\" aria-label=\"might\"></i> while I&#x27;m an attacker.)<b class=\"kwtag\">Deathknell</b><i class=\"trig\">&#9654;</i> Channel 1 rune exhausted. (When I die, get the effect.)"}]}, {"k": "Shield", "cat": "FIGHT", "head": "Stronger when defending.", "icon": "shield", "rule": "814", "ven": false, "off": "+1 <i class=\"mt\" aria-label=\"might\"></i> while I&#x27;m a defender.", "src": "Sunlit Guardian", "ex": [{"n": "Zephyr Sage", "p": 653140, "t": "Unit", "d": ["Calm"], "e": 6, "m": 6, "r": "+1 <i class=\"mt\" aria-label=\"might\"></i> while I&#x27;m a defender.", "x": "<b class=\"kwtag\">Shield</b> (+1 <i class=\"mt\" aria-label=\"might\"></i> while I&#x27;m a defender.)"}, {"n": "Stalwart Poro", "p": 662907, "t": "Unit", "d": ["Calm"], "e": 2, "m": 2, "r": "+1 <i class=\"mt\" aria-label=\"might\"></i> while I&#x27;m a defender.", "x": "<b class=\"kwtag\">Shield</b> (+1 <i class=\"mt\" aria-label=\"might\"></i> while I&#x27;m a defender.)"}, {"n": "Black Flame Altar", "p": 685493, "t": "Battlefield", "d": ["Colorless"], "e": null, "m": null, "r": "+1 <i class=\"mt\" aria-label=\"might\"></i> while they&#x27;re defenders.", "x": "Units here with <b class=\"kwtag\">Temporary</b> have <b class=\"kwtag\">Shield</b>. (+1 <i class=\"mt\" aria-label=\"might\"></i> while they&#x27;re defenders.)"}, {"n": "Mutated Mouser", "p": 684124, "t": "Unit", "d": ["Calm"], "e": 2, "m": 1, "r": "+2 <i class=\"mt\" aria-label=\"might\"></i> while I&#x27;m a defender.", "x": "<b class=\"kwtag\">Shield 2</b> (+2 <i class=\"mt\" aria-label=\"might\"></i> while I&#x27;m a defender.)<b class=\"kwtag\">Tank</b> (I must be assigned combat damage first.)"}, {"n": "Towering Combatant", "p": 686322, "t": "Unit", "d": ["Body"], "e": 4, "m": 3, "r": "+2 <i class=\"mt\" aria-label=\"might\"></i> while I&#x27;m a defender.", "x": "<b class=\"kwtag\">Shield 2</b> (+2 <i class=\"mt\" aria-l /* ---------- tiny helpers ---------- */
function el(h){var d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild;}
function $(s){return document.querySelector(s);}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function img(pid,big){return (big?D.big:D.img).replace('{}',pid);}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));
  var t=a[i];a[i]=a[j];a[j]=t;}return a;}

/* ---------- persistence ---------- */
var S = {};
try{ S = JSON.parse(localStorage.getItem('rbcoach')||'{}'); }catch(e){ S={}; }
S.srs = S.srs || {}; S.stat = S.stat || {};
function save(){ try{ localStorage.setItem('rbcoach', JSON.stringify(S)); }catch(e){} }
function tally(k,ok){ var s=S.stat[k]||{r:0,w:0}; ok?s.r++:s.w++; S.stat[k]=s; save(); }

/* ---------- tap any card to see it full size ----------
   Deliberate: art is the interface, but a full-height card would push the
   decision below the fold. So cards render small and open on demand. */
function zoomable(pid, name, cls){
  return '<button class="cardwrap '+(cls||'')+'" data-zoom="'+pid+'" aria-label="Enlarge '+esc(name)+'">'
       + '<img class="cardimg" alt="'+esc(name)+'" src="'+img(pid)+'" loading="lazy">'
       + '<span class="mag">&#128269;</span></button>';
}
document.addEventListener('click', function(e){
  var b = e.target.closest('[data-zoom]');
  if(!b) return;
  var lb = el('<div class="lb"><img src="'+img(b.dataset.zoom,true)+'" alt=""></div>');
  lb.onclick = function(){ lb.remove(); };
  document.body.appendChild(lb);
});

$('#bigBtn').onclick = function(){
  S.big = !S.big; save();
  document.documentElement.classList.toggle('big', !!S.big);
  this.classList.toggle('on', !!S.big);
};

function viewTurn(){

       +     '<span class="src">'+esc(p.name)+' Phase &middot; rule '+esc(p.rule)+'</span></div>'

}

/* =======================================================================
   WHEN — the 2x2 grid + the timing drill (the flagship)
   ======================================================================= */
var whenQ = null;
function newWhen(){
  var st = pick(D.states);
  var cls = pick(['plain','action','reaction']);
  var pool = D.pools[cls];
  if(!pool || !pool.length){ return newWhen(); }
  var card = pick(pool);
  whenQ = {st:st, card:card, allowed: st.allow.indexOf(cls) >= 0};
  drawWhen();
}
function drawWhen(){
  var q = whenQ, st = q.st, c = q.card;
  var badge = c.cls==='reaction' ? 'REACTION' : (c.cls==='action' ? 'ACTION' : 'NO TIMING WORD');
  var bcol  = c.cls==='plain' ? '#5a6274' : (c.cls==='action' ? '#1e8449' : '#2471a3');
  // Compact banner + small card keeps the YES/NO decision above the fold on a phone.
  var h = '<div class="state row2" style="border-color:'+st.colour+';background:'+st.colour+'22">'
        +   '<span class="sic">'+ic(st.icon)+'</span>'
        +   '<span><b class="sl">'+esc(st.label)+'</b><br><span class="ss">'+esc(st.sub)+'</span></span>'
        + '</div>'
        + '<div class="playrow">'
        +   zoomable(c.pid, c.name, 'md')
        +   '<div class="tbadge" style="--c:'+bcol+'">'+esc(badge)+'</div>'
        + '</div>'
        + '<div class="centre ask">Play it now?</div>'
        + '<div class="ans">'
        +   '<button class="yes" data-a="1">&#10003;<small>YES</small></button>'
        +   '<button class="no" data-a="0">&#10007;<small>NO</small></button>'
        + '</div>'
        + '<div class="verd" id="wv"></div>'
        + '<div class="sect">THE FOUR MOMENTS</div>'
        + grid2();
  var n = $('#v-when'); n.innerHTML = h;
  n.querySelectorAll('[data-a]').forEach(function(b){
    b.onclick = function(){ answerWhen(b.dataset.a === '1'); };
  });
}
/* The four moments as a symbol table: three slots per cell (plain / Action /
   Reaction), each a tick or a cross. Reads at a glance, no sentence to parse. */
function grid2(){
  var slots = [['plain','&mdash;'], ['action','A'], ['reaction','R']];
  var g = '<div class="grid2">';
  D.states.forEach(function(s){
    g += '<div class="g" style="border-color:'+s.colour+'66">'
      +   '<b>'+ic(s.icon)+' '+esc(s.label)+'</b>'
      +   '<small>'+esc(s.sub)+'</small>'
      +   '<span class="slots">'
      +   slots.map(function(sl){
            var ok = s.allow.indexOf(sl[0]) >= 0;
            return '<i class="tk '+(ok?'y':'n')+'"><b>'+sl[1]+'</b>'
                 + (ok?'&#10003;':'&#10007;')+'</i>'; }).join('')
      +   '</span>'
      + '</div>';
  });
  g += '</div><div class="key">'
    +  '<span><b>&mdash;</b> no timing word</span>'
    +  '<span><b>A</b> Action</span>'
    +  '<span><b>R</b> Reaction</span></div>';
  return g;
}
function answerWhen(said){
  var q = whenQ, ok = (said === q.allowed);
  tally('when', ok);
  var v = $('#wv');
  var truth = q.allowed ? 'YES — you can play it.' : 'NO — not right now.';
  v.className = 'verd on ' + (ok ? 'ok' : 'no');
  v.innerHTML = '<div class="vh">'+(ok?'&#10003; Right':'&#10007; Not quite')+'</div>'
    + '<div class="vb"><b>'+esc(truth)+'</b><br>'+esc(q.st.why)+'</div>'
    + '<div class="rule">Core Rules '+esc(q.st.rule)+'</div>'
    + '<button class="big-btn" id="nextW">NEXT &#8250;</button>';
  $('#nextW').onclick = newWhen;
  v.scrollIntoView({behavior:'smooth', block:'center'});
}
function viewWhen(){ newWhen(); }

/* =======================================================================
   WORDS — keyword flashcards with light spaced repetition
   ======================================================================= */
var wordQ = null, wordCat = null;
function dueList(){
  var now = Date.now(), pool = D.kw.filter(function(k){
    return !wordCat || k.cat === wordCat; });
  var due = pool.filter(function(k){ var s=S.srs[k.k]; return !s || !s.due || s.due <= now; });
  return due.length ? due : pool;
}
function newWord(){
  var list = dueList();
  // prefer the least-seen so everything gets covered
  list = list.slice().sort(function(a,b){
    return ((S.srs[a.k]||{}).n||0) - ((S.srs[b.k]||{}).n||0); });
  wordQ = list[0] === wordQ ? (list[1] || list[0]) : list[0];
  drawWord(false);
}
function drawWord(open){
  var k = wordQ, ex = k.ex[0];
  var cat = D.cats.filter(function(c){return c.id===k.cat;})[0] || {col:'#2471a3',name:''};
  var done = Object.keys(S.srs).filter(function(x){return (S.srs[x]||{}).box>=2;}).length;
  var h = '<div class="bar"><i style="width:'+Math.round(done/D.kw.length*100)+'%"></i></div>'
        + '<div class="pstat">'+done+' of '+D.kw.length+' words learned</div>'
        + '<div class="chips">'
        +   '<button class="chip'+(wordCat?'':' on')+'" data-cat="">ALL</button>'
        +   D.cats.map(function(c){
              return '<button class="chip'+(wordCat===c.id?' on':'')+'" style="--c:'+c.col+'" '
                   + 'data-cat="'+c.id+'">'+esc(c.name)+'</button>'; }).join('')
        + '</div>'
        + '<div class="kwhead">'
        +   '<span class="kb" style="border-color:'+cat.col+';color:'+cat.col+'">'+ic(k.icon)+'</span>'
        +   '<span class="kwname">'+esc(k.k)+'</span>'
        +   (k.ven?'<span class="kb" style="border-color:#7d3c98;color:#b07cc6">VENDETTA</span>':'')
        + '</div>';
  if(ex){
    h += '<div class="centre">'+zoomable(ex.p, ex.n, 'md')+'</div>';
  }
  if(!open){
    h += '<button class="big-btn" id="flip">WHAT DOES IT DO?</button>';
  } else {
    h += '<div class="reveal">'
      +    '<div class="kwhead2">'+esc(k.head)+'</div>'
      +    '<div class="official">'+((ex && ex.r) ? ex.r : k.off)
      +      '<span class="src">Riot’s wording, printed on '
      +      esc((ex && ex.r) ? ex.n : k.src)+'</span></div>'
      +    (ex ? '<div class="ctext"><b>'+esc(ex.n)+'</b><br>'+ex.x+'</div>' : '')
      +    '<div class="ans" style="margin-top:16px">'
      +      '<button class="no" data-r="0">&#8635;<small>AGAIN</small></button>'
      +      '<button class="yes" data-r="1">&#10003;<small>GOT IT</small></button>'
      +    '</div>'
      +  '</div>';
  }
  if(k.ex.length > 1){
    h += '<div class="sect">MORE CARDS WITH '+esc(k.k.toUpperCase())+'</div>'
      +  '<div class="minigrid">'
      +  k.ex.slice(1,7).map(function(e){ return zoomable(e.p, e.n, 'sm'); }).join('')
      +  '</div>';
  }
  var n = $('#v-words'); n.innerHTML = h;
  n.querySelectorAll('[data-cat]').forEach(function(b){
    b.onclick = function(){ wordCat = b.dataset.cat || null; newWord(); };
  });
  if($('#flip')) $('#flip').onclick = function(){ drawWord(true); };
  n.querySelectorAll('[data-r]').forEach(function(b){
    b.onclick = function(){ rateWord(b.dataset.r === '1'); };
  });
}
function rateWord(got){
  var s = S.srs[wordQ.k] || {box:0, n:0};
  s.n = (s.n||0) + 1;
  s.box = got ? Math.min((s.box||0)+1, 4) : 0;
  var days = [0, 1, 3, 7, 21][s.box] || 0;
  s.due = Date.now() + days*864e5;
  S.srs[wordQ.k] = s; save();
  tally('words', got);
  newWord();
}
function viewWords(){ newWord(); }

/* =======================================================================
   FIGHT — might arithmetic + kill order
   ======================================================================= */
var fightQ = null;
function newFight(){
  var useDuel = Math.random() < .6 || !D.order.length;
  fightQ = useDuel ? {kind:'duel', d:pick(D.duels)} : {kind:'order', o:pick(D.order)};
  drawFight();
}
function unitBox(u, tag, colour){
  return '<div style="text-align:center">'
    + '<div style="font-size:.6em;font-weight:800;letter-spacing:.08em;color:'+colour+'">'+tag+'</div>'
    + zoomable(u.pid, u.name, 'sm')
    + '</div>';
}
function drawFight(){
  var h = '';
  if(fightQ.kind === 'duel'){
    var d = fightQ.d;
    h = '<p class="lede">A unit deals damage equal to its <b>Might</b>. '
      + 'It dies when it takes damage equal to its Might.</p>'
      + '<div style="display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center">'
      +   unitBox(d.atk, 'ATTACKER', '#c0392b')
      +   '<div style="font-size:1.5em">&#9876;</div>'
      +   unitBox(d.dfd, 'DEFENDER', '#2471a3')
      + '</div>'
      + '<div style="display:grid;grid-template-columns:1fr auto 1fr;gap:10px;text-align:center;margin-top:10px">'
      +   '<div><span class="en">'+d.af+'</span> <span class="mt"></span>'
      +     (d.atk.assault?'<div class="muted">'+d.atk.might+' + '+d.atk.assault+' assault</div>':'')+'</div>'
      +   '<div></div>'
      +   '<div><span class="en">'+d.df+'</span> <span class="mt"></span>'
      +     (d.dfd.shield?'<div class="muted">'+d.dfd.might+' + '+d.dfd.shield+' shield</div>':'')+'</div>'
      + '</div>'
      + '<div class="centre ask">Does the defender die?</div>'
      + '<div class="ans">'
      +   '<button class="yes" data-f="1">&#10003;<small>YES</small></button>'
      +   '<button class="no" data-f="0">&#10007;<small>NO</small></button>'
      + '</div>';
  } else {
    var o = fightQ.o;
    h = '<p class="lede"><b>Tank</b> must be dealt with first. <b>Backline</b> is dealt with last.</p>'
      + '<div class="centre ask" style="margin-bottom:12px">'+esc(o.ask)+'</div>'
      + '<div class="minigrid">'
      +   o.group.map(function(u,i){
            return '<button class="pickcard" data-o="'+i+'">'
              + '<img class="cardimg" alt="'+esc(u.name)+'" src="'+img(u.pid)+'" loading="lazy">'
              + '<span class="pn">'+esc(u.name)+'</span>'
              + '</button>'; }).join('')
      + '</div>';
  }
  h += '<div class="verd" id="fv"></div>';
  var n = $('#v-fight'); n.innerHTML = h;
  n.querySelectorAll('[data-f]').forEach(function(b){
    b.onclick = function(){ answerFight(b.dataset.f === '1'); };
  });
  n.querySelectorAll('[data-o]').forEach(function(b){
    b.onclick = function(){ answerOrder(+b.dataset.o); };
  });
}
function answerFight(said){
  var d = fightQ.d, ok = (said === d.dfd_dies);
  tally('fight', ok);
  var why = d.af + ' damage against ' + d.df + ' might. '
          + (d.dfd_dies ? 'Enough — the defender dies.' : 'Not enough — it survives.')
          + (d.atk_dies ? ' The attacker dies too.' : ' The attacker lives.');
  showVerd('#fv', ok, (d.dfd_dies?'YES — it dies.':'NO — it survives.'), why, '458 / 807 / 814', newFight);
}
function answerOrder(i){
  var o = fightQ.o, chosen = o.group[i], ok = (chosen.name === o.answer);
  tally('fight', ok);
  var why = o.kind === 'tank'
    ? o.answer + ' has Tank, so it must be assigned lethal damage before the others.'
    : o.answer + ' has Backline, so it is assigned damage only after the others.';
  showVerd('#fv', ok, 'It is ' + o.answer + '.', why, o.kind==='tank'?'815':'826', newFight);
}
function showVerd(sel, ok, head, body, rule, next){
  var v = $(sel);
  v.className = 'verd on ' + (ok ? 'ok' : 'no');
  v.innerHTML = '<div class="vh">'+(ok?'&#10003; Right':'&#10007; Not quite')+'</div>'
    + '<div class="vb"><b>'+esc(head)+'</b><br>'+esc(body)+'</div>'
    + '<div class="rule">Core Rules '+esc(rule)+'</div>'
    + '<button class="big-btn" id="nx">NEXT &#8250;</button>';
  $('#nx').onclick = next;
  v.scrollIntoView({behavior:'smooth', block:'center'});
}
function viewFight(){ newFight(); }

/* =======================================================================
   WIN — how points actually happen
   ======================================================================= */
function viewWin(){
  var w = D.win;
  var track = '<div class="track">';
  for(var i=1;i<=w.target;i++){
    track += '<i class="'+(i===w.target?'last':'')+'">'+i+'</i>';
  }
  track += '</div>';
  var h = '<p class="lede">First to <b>'+w.target+' points</b> wins. '
        + '(Teams play to '+w.team_target+'.)</p>'
        + track
        + '<div class="sect">TWO WAYS TO SCORE</div>';
  w.ways.forEach(function(x){
    h += '<div class="row" style="border-color:'+x.colour+'55">'
      +   '<span class="ic" style="color:'+x.colour+'">'+ic(x.icon)+'</span>'
      +   '<span class="tx"><b>'+esc(x.k)+' &mdash; '+esc(x.head)+'</b>'
      +     '<small>'+esc(x.detail)+'</small></span>'
      + '</div>';
  });
  h += '<div class="official" style="border-left-color:#b7950b;margin-top:6px">'
    +  'You can only score a battlefield <b>once per turn</b>.'
    +  '<span class="src">Core Rules 465</span></div>'
    +  '<div class="sect">THE TRAP AT 7 POINTS</div>'
    +  '<div class="official" style="border-left-color:#c0392b">'
    +    '<b>'+esc(w.last_point.head)+'</b><br><br>'
    +    '&#9875; '+esc(w.last_point.hold_ok)+'<br><br>'
    +    '&#127937; '+esc(w.last_point.conquer_no)
    +    '<span class="src">Core Rules '+esc(w.last_point.rule)+'</span></div>'
    +  '<div class="official" style="border-left-color:#1e8449;margin-top:10px">'
    +    'So: plan to win by <b>holding</b>, not by grabbing.</div>';
  $('#v-win').innerHTML = h;
}

/* =======================================================================
   nav
   ======================================================================= */
var VIEWS = {turn:viewTurn, when:viewWhen, words:viewWords, fight:viewFight, win:viewWin};
function go(v){
  document.querySelectorAll('.view').forEach(function(s){ s.classList.remove('on'); });
  $('#v-'+v).classList.add('on');
  document.querySelectorAll('nav button').forEach(function(b){
    b.classList.toggle('on', b.dataset.v === v); });
  VIEWS[v]();
  window.scrollTo(0,0);
  S.last = v; save();
}
document.querySelectorAll('nav button').forEach(function(b){
  b.onclick = function(){ go(b.dataset.v); };
});

document.documentElement.classList.toggle('big', !!S.big);
$('#bigBtn').classList.toggle('on', !!S.big);
go(S.last && VIEWS[S.last] ? S.last : 'turn');
</script>
</body>
</html>
